<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Tabel masini JSON Array</title>

    <style>
        table {
            font-family: arial, sans-serif;
            border-collapse: collapse;
            width: 100%;
        }

        td, th {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }

        input, button {
            margin: 5px;
            padding: 5px;
        }

        #mesaj {
            color: red;
        }
    </style>
</head>

<body>

<h1>Masinile dorite</h1>

<form onsubmit="return adaugaMasina()">
    <input id="marca" placeholder="Marca" required>
    <input id="model" placeholder="Model" required>
    <input id="culoare" placeholder="Culoare" required>
    <input id="anFab" type="number" placeholder="An fabricatie" required>

    <button type="submit">Adauga masina</button>
</form>

<p id="mesaj"></p>

<table id="tm">
    <tr>
        <th>Marca</th>
        <th>Model</th>
        <th>Culoare</th>
        <th>An fabricatie</th>
    </tr>
</table>

<script>

// Tabloul in care pastram masinile
const masini2Store = [];

// Constructorul obiectului masina
function masina(mk, md, cl, an) {
    this.marca = mk;
    this.model = md;
    this.culoare = cl;
    this.anFab = an;

    this.randNou = function() {
        return "<tr><td>" + this.marca +
            "</td><td>" + this.model +
            "</td><td>" + this.culoare +
            "</td><td>" + this.anFab +
            "</td></tr>";
    };
}

// Citirea tabloului din Local Storage
if (localStorage.carsArray) {

    let arrayJSON = localStorage.carsArray;
    var masiniStored = JSON.parse(arrayJSON);

    for (var i = 0; i < masiniStored.length; i++) {

        document.getElementById("tm").innerHTML += masiniStored[i].randNou;

        masini2Store.push(masiniStored[i]);
    }
}

// Functia de validare
function valideaza(marca, model, culoare, an) {

    if (marca.trim() == "") {
        return "Introduceti marca masinii!";
    }

    if (model.trim() == "") {
        return "Introduceti modelul masinii!";
    }

    if (culoare.trim() == "") {
        return "Introduceti culoarea masinii!";
    }

    var anNumar = Number(an);
    var anCurent = new Date().getFullYear();

    if (!Number.isInteger(anNumar) ||
        anNumar < 1900 ||
        anNumar > anCurent) {
        return "Anul trebuie sa fie un numar intreg intre 1900 si " + anCurent + "!";
    }

    return "";
}

// Functia de adaugare
function adaugaMasina() {

    var marca = document.getElementById("marca").value.trim();
    var model = document.getElementById("model").value.trim();
    var culoare = document.getElementById("culoare").value.trim();
    var an = document.getElementById("anFab").value;

    var eroare = valideaza(marca, model, culoare, an);

    if (eroare != "") {
        document.getElementById("mesaj").innerHTML = eroare;
        return false;
    }

    var mNoua = new masina(marca, model, culoare, Number(an));

    document.getElementById("tm").innerHTML += mNoua.randNou();

    // Transformarea metodei in text HTML
    mNoua.randNou = mNoua.randNou().toString();

    // Adaugarea masinii in tablou
    masini2Store.push(mNoua);

    // Transformarea tabloului in JSON
    var myJSON = JSON.stringify(masini2Store);

    // Salvarea in Local Storage
    localStorage.setItem("carsArray", myJSON);

    document.getElementById("mesaj").innerHTML = "";

    document.getElementById("marca").value = "";
    document.getElementById("model").value = "";
    document.getElementById("culoare").value = "";
    document.getElementById("anFab").value = "";

    return false;
}

</script>

<!--
Exercitiul 6:

Fata de L8_B, aceasta varianta foloseste un tablou
de obiecte numit masini2Store.

Tabloul este salvat in Local Storage sub cheia carsArray.

La incarcarea paginii, tabloul este citit cu JSON.parse,
iar cu ajutorul unei bucle for sunt afisate toate
masinile salvate.

La adaugarea unei masini, aceasta este introdusa
in tablou cu push(), iar apoi intregul tablou
este transformat in JSON si salvat.

Astfel, toate masinile adaugate sunt pastrate
si afisate in ordinea adaugarii.
-->

</body>
</html>
