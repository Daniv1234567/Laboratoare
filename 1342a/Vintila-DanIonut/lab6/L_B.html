<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>L6_B</title>
</head>
<body>
<button id="schimba">Schimbă conținuturile</button>

<p id="p1" style="color: blue; font-weight: bold; font-size: 20px;">Primul paragraf: albastru și îngrosat.</p>
<p id="p2" style="color: green; font-style: italic; background: #eeeeee;">Al doilea paragraf: verde, cursiv, pe fundal gri.</p>

<script>
var p1 = document.getElementById("p1");
var p2 = document.getElementById("p2");

function editeaza() {
    var text = prompt("Introdu noul text:", this.innerHTML);
    if (text !== null && text !== "") {
        this.innerHTML = text;
    }
}

p1.onclick = editeaza;
p2.onclick = editeaza;

document.getElementById("schimba").onclick = function () {
    var aux = p1.innerHTML;
    p1.innerHTML = p2.innerHTML;
    p2.innerHTML = aux;
};
</script>
</body>
</html>
